name: a95-aud
on:
  workflow_dispatch:
    inputs:
      mode:
        description: build or cleanup
        required: true
        default: buildaudio
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq imagemagick unzip >/dev/null 2>&1 || true
      - name: run
        env:
          MODE: ${{ inputs.mode }}
        run: |
          curl -sL https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/tools/a95.py -o /tmp/a95.py
          python3 /tmp/a95.py

{"name":"auto-collect-audio","on":{"push":{"paths":["triggers/audio-live.txt"]},"workflow_dispatch":{"inputs":{"dry_run":{"description":"list candidates only","required":false,"type":"boolean","default":false},"max_packs":{"description":"packs per run (default 3)","required":false,"type":"string","default":"3"}}}},"concurrency":{"group":"auto-collect-audio","cancel-in-progress":false},"permissions":{"contents":"write"},"jobs":{"collect":{"runs-on":"ubuntu-latest","timeout-minutes":40,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"uses":"actions/checkout@v4","with":{"repository":"sigco3111/assets-3d-lowpoly-2","path":"src","fetch-depth":1}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"kill-switch check","run":"test -f triggers/auto-collect-stop.txt && echo 'STOP: kill-switch on' >> $GITHUB_STEP_SUMMARY || true"},{"name":"install pillow","if":"hashFiles('triggers/auto-collect-stop.txt') == ''","run":"pip install -q pillow"},{"name":"transform collect code","if":"hashFiles('triggers/auto-collect-stop.txt') == ''","run":"python3 - <<'PY'\nimport json\nw=json.load(open('src/.github/workflows/auto-collect.yml',encoding='utf-8'))\nrun=[s for s in w['jobs']['collect']['steps'] if s.get('name')=='collect'][0]['run']\nbody=run.split('\\n',1)[1].rsplit('\\nPY',1)[0]\nR=json.loads(r'''[[\"REPO = 'sigco3111/assets-3d-lowpoly-2'\",\"REPO = 'sigco3111/assets-audio'\\nKIND = {}\"],[\"keys=&field_art_type_tid%5B%5D=10&sort_by=' + sort + '&sort_order\",\"keys=&field_art_type_tid%5B%5D=' + sort.split('|')[1] + '&sort_by=' + sort.split('|')[0] + '&sort_order\"],[\"for sort in ['created', 'count']:\",\"for sort in ['created|12', 'created|13']:\"],[\"for pg in range(6):\",\"for pg in range(8):\"],[\"if p not in paths: paths.append(p)\",\"if p not in paths:\\n                    paths.append(p); KIND[p] = '음악' if sort.endswith('|12') else '효과음'\"],[\"'3d,opengameart'\",\"'audio,opengameart'\"],[\"kind='3D 모델'\",\"kind=KIND.get(p['path'], '효과음')\"],[\"(blend|obj|fbx|glb|gltf|dae)$', n, re.I) for n in names\",\"(ogg|wav|mp3|flac)$', n, re.I) for n in names\"],[\"(blend|obj|fbx|glb|gltf|dae)$', name, re.I):\",\"(ogg|wav|mp3|flac)$', name, re.I):\"],[\"tar\\\\.gz|blend|obj|fbx|glb|gltf|dae)$\",\"tar\\\\.gz|ogg|wav|mp3|flac)$\"],[\"'3D 파일 없음'\",\"'오디오 파일 없음'\"],[\"if size_mb > 700:\",\"if size_mb > 650:\"],[\"if not title: title = path.split('/')[-1].replace('-', ' ').title()\",\"if not title: title = path.split('/')[-1].replace('-', ' ').title()\\n    title = re.sub(r'^[\\\\s:：\\\\-–—]+', '', title).strip()\"],[\"img=html.unescape(og.group(1)) if og else ''\",\"img=''\"],[\"log('SKIP no-preview %s' % path); continue\",\"pass\"],[\"im = Image.open(io.BytesIO(get(p['img'], lim=10 * 1024 * 1024))).convert('RGBA')\",\"im = None\"],[\"for sz in (960, 720, 512):\",\"for sz in ():\"],[\"with open(os.path.join(folder, 'preview.png'), 'wb') as f: f.write(out)\",\"if out:\\n        with open(os.path.join(folder, 'preview.png'), 'wb') as f: f.write(out)\"],[\"preview='preview.png'\",\"preview=''\"],[\"seen >= 150\",\"seen >= 400\"],[\"        if not p['lic']:\\n\",\"        if re.search(r'halloween|christmas|xmas|easter|valentine|thanksgiving|santa|holiday|seasonal|new.?year', (p['title']+' '+slug).lower()):\\n            log('SKIP seasonal %s' % path); continue\\n        if not p['lic']:\\n\"]]''')\nfor a,b in R:\n    assert body.count(a)==1,(a,body.count(a))\n    body=body.replace(a,b)\nopen('/tmp/collect.py','w',encoding='utf-8').write(body)\nprint('transform ok',len(body))\nPY"},{"name":"collect","if":"hashFiles('triggers/auto-collect-stop.txt') == ''","env":{"DRY":"false","MAXP":"3","GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"run":"python3 /tmp/collect.py"}]}}}

name: tmp-a102-clean
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: remove temp files
        run: |
          git config user.name sigco3111
          git config user.email sigco3111@users.noreply.github.com
          git rm -q --ignore-unmatch .github/workflows/tmp-a102-audio.yml .github/workflows/tmp-a102-audio2.yml tmp-a102-clean.yml tmp-a102-audio-result.txt
          git commit -m "정리: A102 임시 파일 삭제" || echo nothing
          git pull --rebase origin main || true
          git push origin HEAD:main

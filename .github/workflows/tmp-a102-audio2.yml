name: tmp-a102-audio2
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: readme
        run: |
          python3 - <<'PY'
          import subprocess
          p = 'README.md'
          t = open(p, encoding='utf-8').read()
          res = []
          if '### 8-Bit Sound Effect Pack' in t:
              res.append('SECTION_ALREADY=' + str(t.find('### 8-Bit Sound Effect Pack')))
          else:
              sec = ['### 8-Bit Sound Effect Pack',
                     '- 파일: `Game_SFX_by_OwlishMedia_0.zip` (효과음 75개: 8비트 레트로 타격·점프·아이템 등)',
                     '- 제작: OwlishMedia / 라이선스: CC0 / 원본: https://opengameart.org/content/8-bit-sound-effect-pack',
                     '']
              i = t.find('## 수록 팩')
              j = t.find('\n## ', i + 1) if i >= 0 else -1
              res.append('PACK_SEC_AT=%d NEXT_SEC_AT=%d' % (i, j))
              if j == -1:
                  if not t.endswith('\n'): t += '\n'
                  t = t + '\n' + '\n'.join(sec) + '\n'
              else:
                  t = t[:j+1] + '\n'.join(sec) + '\n' + t[j+1:]
              open(p, 'w', encoding='utf-8').write(t)
              res.append('INSERTED=1 LEN=%d' % len(t))
          res.append('OTHER_MENTIONS=%d' % t.count('8-Bit Sound Pack'))
          res.append('ANY_8BIT=%d' % t.count('8-Bit'))
          open('tmp-a102-audio-result.txt', 'w', encoding='utf-8').write('\n'.join(res) + '\n')
          print('\n'.join(res))
          subprocess.run(['git', 'add', p, 'tmp-a102-audio-result.txt'], check=False)
          subprocess.run(['git', 'config', 'user.name', 'sigco3111'], check=False)
          subprocess.run(['git', 'config', 'user.email', 'sigco3111@users.noreply.github.com'], check=False)
          r = subprocess.run(['git', 'commit', '-m', '문서: 8-Bit Sound Effect Pack 항목 추가'], capture_output=True, text=True)
          print('COMMIT_RC', r.returncode, r.stdout[-200:], r.stderr[-200:])
          subprocess.run(['git', 'pull', '--rebase', 'origin', 'main'], check=False, capture_output=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=False)
          PY

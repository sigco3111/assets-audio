name: tmp-web-fetch-audio-20261126
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and stage
        run: |
          set -e
          mkdir -p 52-cc0-drums-and-synths /tmp/dl
          curl -fL -o /tmp/dl/52_cc0_drums_and_synths_.zip 'https://opengameart.org/sites/default/files/52_cc0_drums_and_synths_.zip'
          cp /tmp/dl/52_cc0_drums_and_synths_.zip 52-cc0-drums-and-synths/52-cc0-drums-and-synths.zip
          printf "%s\n" "52 CC0 drums and synths by fvcalderan, OpenGameArt (https://opengameart.org/content/52-cc0-drums-and-synths), CC0" > 52-cc0-drums-and-synths/CREDITS.txt
          echo  | base64 -d > 52-cc0-drums-and-synths/meta.json
          ls -la 52-cc0-drums-and-synths
      - name: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- 52-cc0-drums-and-synths
          git commit -m 'assets: 웹 탐색 2회차 오디오 팩 추가 (52 CC0 drums and synths)'
          git pull --rebase -q || true
          git push

name: tmp-a102-audio
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: readme
        run: |
          python3 - <<'PY'
          import subprocess
          p = 'README.md'
          t = open(p, encoding='utf-8').read()
          if '8-Bit Sound Effect Pack' in t:
              print('already present')
          else:
              sec = ['### 8-Bit Sound Effect Pack',
                     '- 파일: `Game_SFX_by_OwlishMedia_0.zip` (효과음 75개: 8비트 레트로 타격·점프·아이템 등)',
                     '- 제작: OwlishMedia / 라이선스: CC0 / 원본: https://opengameart.org/content/8-bit-sound-effect-pack',
                     '']
              i = t.find('## 수록 팩')
              j = t.find('\n## ', i + 1) if i >= 0 else -1
              if j == -1:
                  if not t.endswith('\n'): t += '\n'
                  t = t + '\n' + '\n'.join(sec) + '\n'
              else:
                  t = t[:j+1] + '\n'.join(sec) + '\n' + t[j+1:]
              open(p, 'w', encoding='utf-8').write(t)
              print('inserted')
          subprocess.run(['git', 'config', 'user.name', 'sigco3111'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'sigco3111@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', p], check=True)
          subprocess.run(['git', 'commit', '-m', '문서: 8-Bit Sound Effect Pack 항목 추가'], check=False)
          subprocess.run(['git', 'pull', '--rebase', 'origin', 'main'], check=False, capture_output=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=False)
          PY
      - name: cleanup
        run: |
          git rm -q .github/workflows/tmp-a102-audio.yml || true
          git config user.name sigco3111
          git config user.email sigco3111@users.noreply.github.com
          git commit -m "정리: A102 임시 워크플로 삭제" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

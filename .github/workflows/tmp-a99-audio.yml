name: tmp a99 audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/tmp_a99_audio.py

name: batch-ingest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick unzip >/dev/null
      - name: ingest
        run: |
          set -uo pipefail
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          SLUG=packsmithy-sfx-sampler
          TITLE="Packsmithy SFX sampler: 30 synthesised sound effects"
          URL=https://opengameart.org/sites/default/files/packsmithy-sfx-sampler.zip
          LIC="CC-BY 4.0"
          AUTHOR=packsmithy
          PUB=2026-10-01
          TAGS="sfx, ui, retro, horror, sci-fi, glitch, effect"
          SRC=https://opengameart.org/content/packsmithy-sfx-sampler-30-synthesised-sound-effects-ui-retro-horror-sci-fi-glitch
          mkdir -p "$SLUG"
          curl -fsSL --retry 3 -o "$SLUG/$SLUG.zip" "$URL"
          rm -rf _x && mkdir _x
          unzip -qo "$SLUG/$SLUG.zip" -d _x || true
          N=$(find _x -type f | wc -l)
          PREV=$(find _x -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -n "$PREV" ]; then convert "$PREV" -resize 512x512 -background white -gravity center -extent 512x512 "$SLUG/preview.jpg"; else convert -size 512x512 xc:white -pointsize 24 -gravity center -annotate 0 "$TITLE" "$SLUG/preview.jpg"; fi
          rm -rf _x
          ZSIZE=$(du -h "$SLUG/$SLUG.zip" | cut -f1)
          printf '# %s\n\n- 출처 URL: %s\n- 받은 파일: %s.zip (%s)\n- 라이선스: %s\n- 제작자: %s\n- 공개일: %s\n- 파일 수: %s\n- 태그: %s\n- 표기 요구: 있음 (CC-BY 4.0) — CREDITS.txt 참조\n- AI 생성 여부: 출처 페이지에 언급 없음\n' "$TITLE" "$SRC" "$SLUG" "$ZSIZE" "$LIC" "$AUTHOR" "$PUB" "$N" "$TAGS" > "$SLUG/pack.md"
          printf '%s\n\n출처 URL: %s\n표기 라이선스: %s\n제작자: %s\n공개일: %s\n\n이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.\n' "$TITLE" "$SRC" "$LIC" "$AUTHOR" "$PUB" > "$SLUG/LICENSE-SOURCE.txt"
          printf '%s\n\n제작자: %s (OpenGameArt.org)\n출처: %s\n라이선스: %s\n\n표기 예:\n"%s" by %s (OpenGameArt.org), %s\n' "$TITLE" "$AUTHOR" "$SRC" "$LIC" "$TITLE" "$AUTHOR" "$LIC" > "$SLUG/CREDITS.txt"
          git add -A
          git commit -m "에셋: $TITLE 추가"
          git push

name: ingest-pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ImageMagick 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick fonts-dejavu-core
      - name: Pocket Bleeps
        run: |
          set -euo pipefail
          D=pocket-bleeps
          mkdir -p "$D"
          curl -fsSL -o "$D/pocket-bleeps-free-sampler-31-sfx-wav-cc-by.zip" "https://opengameart.org/sites/default/files/pocket-bleeps-free-sampler-31-sfx-wav-cc-by.zip"
          curl -fsSL -o /tmp/pv "https://opengameart.org/sites/default/files/styles/medium/public/audio_preview/preview_7_sfx.mp3.png"
          convert /tmp/pv -resize "900x900>" "$D/preview.jpg"
          cat > "$D/pack.md" <<'EOF'
          # Pocket Bleeps – 31 Retro 8-Bit SFX (Free Sampler, CC-BY)
          
          - 출처 URL: https://opengameart.org/content/pocket-bleeps-%E2%80%93-31-retro-8-bit-sfx-free-sampler-cc-by
          - 받은 파일: pocket-bleeps-free-sampler-31-sfx-wav-cc-by.zip (97.5 KB)
          - 라이선스: CC-BY 4.0
          - 제작자: Pocket Bleeps
          - 공개일: 2026-11-09
          - 파일 수: 1 (zip, WAV 31종)
          - 태그: sfx, 8-bit, chiptune, retro, hit, explosion, ui
          - 표기 요구: 있음 (CC-BY 4.0) — CREDITS.txt 참조
          - AI 생성 여부: 출처 페이지에 언급 없음
          EOF
          cat > "$D/LICENSE-SOURCE.txt" <<'EOF'
          Pocket Bleeps – 31 Retro 8-Bit SFX (Free Sampler, CC-BY)
          
          출처 URL: https://opengameart.org/content/pocket-bleeps-%E2%80%93-31-retro-8-bit-sfx-free-sampler-cc-by
          표기 라이선스: CC-BY 4.0 (https://creativecommons.org/licenses/by/4.0/)
          제작자: Pocket Bleeps
          공개일: 2026-11-09
          
          이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.
          원본 배포물에 라이선스 파일이 포함되어 있지 않으면 이 파일이 그 역할을 합니다.
          EOF
          cat > "$D/CREDITS.txt" <<'EOF'
          Pocket Bleeps – 31 Retro 8-Bit SFX (Free Sampler, CC-BY)
          
          제작자: Pocket Bleeps (OpenGameArt.org)
          출처: https://opengameart.org/content/pocket-bleeps-%E2%80%93-31-retro-8-bit-sfx-free-sampler-cc-by
          라이선스: CC-BY 4.0 (https://creativecommons.org/licenses/by/4.0/)
          
          표기 예:
          "Pocket Bleeps – 31 Retro 8-Bit SFX" by Pocket Bleeps (OpenGameArt.org), CC-BY 4.0
          EOF
          git add -A
          git -c user.name=sigco3111 -c user.email=sigco3111@users.noreply.github.com commit -m "에셋: Pocket Bleeps 추가"
          git push

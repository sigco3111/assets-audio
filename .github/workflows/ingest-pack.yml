name: ingest-pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ImageMagick 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick fonts-dejavu-core
      - name: IgnisForge Free SFX Sampler
        run: |
          set -euo pipefail
          D=ignisforge-free-sfx-sampler
          B=https://opengameart.org/sites/default/files
          mkdir -p "$D"
          curl -fsSL -o "$D/ignisforge-oga-sampler-cc0.zip" "$B/ignisforge-oga-sampler-cc0.zip"
          convert -size 900x560 xc:"#111827" -gravity center -font DejaVu-Sans -pointsize 40 -fill "#f9fafb" -annotate +0+0 "IgnisForge Free SFX Sampler" "$D/preview.jpg" || convert -size 900x560 gradient:"#1f2937-#111827" "$D/preview.jpg"
          cat > "$D/pack.md" <<'EOF'
          # IgnisForge Free SFX Sampler

          - 출처 URL: https://opengameart.org/content/ignisforge-free-sfx-sampler-43-synthesized-retro-sound-effects
          - 받은 파일: ignisforge-oga-sampler-cc0.zip (1.2 MB)
          - 라이선스: CC0
          - 제작자: ignisforge
          - 공개일: 2026-08-19
          - 파일 수: 1 (zip 안 43개 효과음)
          - 태그: sfx, retro, ui, sci-fi, glitch, synth
          - 표기 요구: 없음 (CC0)
          - AI 생성 여부: 출처 페이지에 "AI 모델·서드파티 샘플 미사용" 명시(자체 합성)
          EOF
          cat > "$D/LICENSE-SOURCE.txt" <<'EOF'
          IgnisForge Free SFX Sampler

          출처 URL: https://opengameart.org/content/ignisforge-free-sfx-sampler-43-synthesized-retro-sound-effects
          표기 라이선스: CC0
          제작자: ignisforge
          공개일: 2026-08-19

          이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.
          원본 배포물(zip)에 라이선스 파일이 포함되어 있지 않으면 이 파일이 그 역할을 합니다.
          EOF
          git add -A
          git -c user.name=sigco3111 -c user.email=sigco3111@users.noreply.github.com commit -m "에셋: IgnisForge Free SFX Sampler 추가"
          git push
